<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f7f1">
  <meta name="description" content="考研英语一阅读与翻译词汇。翻卡背词、复习未掌握词条，坚持每日打卡。">
  <title>每日词记｜考研英语一词汇打卡</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <script defer src="./words.js"></script>
  <script defer src="./app.js"></script>
</head>
<body data-page="study">
  <header class="header">
    <div class="frame header-inner">
      <a class="brand" href="#study" aria-label="每日词记首页">
        <span class="brand-icon" data-icon="book"></span><span>每日词记</span>
      </a>
      <nav class="nav" aria-label="主导航">
        <a href="#study" data-page-link="study"><span data-icon="cards"></span>背单词</a>
        <a href="#bank" data-page-link="bank"><span data-icon="book"></span>词库</a>
        <a href="#checkin" data-page-link="checkin"><span data-icon="calendar"></span>打卡</a>
      </nav>
      <span id="header-date" class="header-date"></span>
    </div>
  </header>

  <main class="frame">
    <section id="intro" class="intro">
      <div class="intro-kicker"><span data-icon="book"></span> 考研英语一 · 阅读与翻译</div>
      <h1 id="page-title" tabindex="-1">英语一词汇打卡</h1>
      <p id="page-description">按做题优先级背词，从作者观点、逻辑关系和熟词僻义入手。</p>
    </section>

    <p id="storage-warning" class="notice" hidden>当前浏览器限制了本地存储，这次学习进度可能在关闭页面后丢失。</p>

    <div class="workspace">
      <section id="study" class="panel study-panel" aria-labelledby="study-heading">
        <div class="section-head">
          <div><h2 id="study-heading">翻卡练习</h2><p id="deck-description">优先熟悉阅读和翻译里实用的词义。</p></div>
          <label class="select-wrap">
            <span class="sr-only">选择练习词组</span>
            <select id="deck"></select><span data-icon="chevron-down"></span>
          </label>
        </div>
        <div class="card-caption"><span id="deck-name"></span><span id="card-position"></span></div>
        <div class="track deck-track" aria-hidden="true"><span id="deck-bar"></span></div>

        <button id="flashcard" class="flashcard" type="button" aria-label="翻卡查看中文释义">
          <span id="card-category" class="card-category"></span>
          <strong id="card-word" lang="en" class="card-word"></strong>
          <span id="card-meaning" class="card-meaning" hidden></span>
          <span id="card-note" class="card-note" hidden></span>
          <span id="flip-hint" class="flip-hint"><span data-icon="repeat"></span><span id="flip-label">点击查看中文释义</span></span>
        </button>
        <div class="empty-card" id="empty-card" hidden>
          <span data-icon="check-circle"></span>
          <strong id="empty-title"></strong>
          <p id="empty-description"></p>
          <button type="button" class="button primary" id="restart"></button>
        </div>
        <div class="answers" id="answers">
          <button class="button answer review" id="unknown" type="button"><span data-icon="repeat"></span>不认识<span class="answer-extra"> · 稍后复习</span></button>
          <button class="button answer primary" id="known" type="button"><span data-icon="check"></span>认识<span class="answer-extra"> · 标为掌握</span></button>
        </div>
        <div class="study-footer">
          <button class="text-button" id="prev" type="button"><span data-icon="chevron-left"></span>上一张</button>
          <button class="text-button" id="review-link" type="button"><span data-icon="repeat"></span><span id="review-label">复习错词</span></button>
          <button class="text-button" id="next" type="button">下一张<span data-icon="chevron-right"></span></button>
        </div>
      </section>

      <aside class="summary" aria-label="学习进度">
        <section class="panel today-panel" aria-labelledby="today-heading">
          <div class="section-head">
            <div><h2 id="today-heading">今日打卡</h2><p id="today-date"></p></div>
            <span id="day-icon" class="section-icon" data-icon="calendar"></span>
          </div>
          <div class="goal-count"><strong id="today-count">0</strong><span id="goal-count"></span></div>
          <div id="goal-progress" class="track goal-track" role="progressbar" aria-label="今日打卡进度" aria-valuemin="0"><span id="goal-bar"></span></div>
          <p id="goal-status" class="goal-status"></p>
          <div class="goal-settings">
            <label for="goal">每日目标</label>
            <label class="select-wrap select-small">
              <select id="goal" aria-label="每日目标">
                <option value="10">10 词</option><option value="20">20 词</option><option value="30">30 词</option><option value="50">50 词</option>
              </select>
              <span data-icon="chevron-down"></span>
            </label>
          </div>
        </section>

        <section class="panel week-panel" aria-labelledby="week-heading">
          <div class="section-head">
            <div><h2 id="week-heading">最近 7 天</h2><p id="streak">连续打卡 0 天</p></div>
            <span class="section-icon warm" data-icon="flame"></span>
          </div>
          <ol id="week" class="week"></ol>
        </section>

        <section class="panel mastery-panel" aria-labelledby="mastery-heading">
          <div class="section-head">
            <div><h2 id="mastery-heading">累计掌握</h2><p id="mastery-count"></p></div>
            <span class="section-icon" data-icon="layers"></span>
          </div>
          <div class="track goal-track" aria-hidden="true"><span id="mastery-bar"></span></div>
        </section>
      </aside>
    </div>

    <section id="bank" class="panel bank-panel" hidden aria-labelledby="bank-heading">
      <div class="section-head">
        <div><h2 id="bank-heading">分类词库</h2><p>用英文或中文搜索，点击词条即可开始翻卡。</p></div>
        <label class="search"><span data-icon="search"></span><span class="sr-only">搜索词库</span><input id="search" type="search" placeholder="搜索英文或中文" autocomplete="off"></label>
      </div>
      <div id="filters" class="filters" aria-label="词库分类"></div>
      <p id="results-count" class="result-count" aria-live="polite"></p>
      <ul id="word-list" class="word-list"></ul>
    </section>

    <section id="topics" class="topics" aria-labelledby="topics-heading">
      <div class="section-head"><div><h2 id="topics-heading">按类练习</h2><p>选择想巩固的词汇分类。</p></div><a href="#bank" class="text-button">查看完整词库</a></div>
      <div id="topic-grid" class="topic-grid"></div>
    </section>
    <footer class="site-footer">
      <span id="word-count"></span>
      <span>进度保存在当前浏览器</span>
    </footer>
  </main>
  <div id="live" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <noscript>请启用 JavaScript 以使用词卡和打卡。</noscript>
</body>
</html>
